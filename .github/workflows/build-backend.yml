name: Build backend image

# Azure for Students blocks ACR Tasks ("TasksOperationsNotAllowed"), which is
# the mechanism `az containerapp up --source` uses to build an image in the
# cloud. This machine also has no Docker, so a local build is not an option.
#
# GitHub Actions fills both gaps: it builds the image on a free runner and
# pushes it to ghcr.io. Because this repository is public, the push
# authenticates with the automatic GITHUB_TOKEN -- no secret has to be created
# or stored.
#
# Pulling is a separate matter. ghcr.io creates the package PRIVATE by default
# even from a public repository, so the image is NOT anonymously pullable until
# its visibility is changed once (see the last step). That one-off change is
# sticky: later pushes to the same package keep it.
#
# The tag this produces is what `az containerapp create --image` consumes.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Deliberately NOT derived from the repository name.
  #
  # The repository is `KSI-AttendanceGeofencingandBiometrics-`, so lowercasing
  # it yields a TRAILING HYPHEN. Docker image components must match
  # [a-z0-9]+([._-][a-z0-9]+)*, which forbids a trailing separator -- ghcr.io
  # rejects it with NAME_INVALID, "invalid repository name", and the build dies
  # at the push step after compiling successfully.
  IMAGE_NAME: klassic-attendance-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Only the OWNER is derived from the repository, and only to lowercase it
      # (`HYT-Foundation-Inc-Tech-Interns`). The image name itself is the fixed
      # IMAGE_NAME above -- the repository name cannot be used, see the comment
      # on IMAGE_NAME.
      - name: Compute the image name
        id: img
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile's COPY paths are relative to backend/, so the
          # context must be backend/ and not the repository root.
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ghcr.io creates a package PRIVATE by default, even when it is pushed
      # from a public repository. Azure Container Apps then cannot pull it
      # without registryCredentials, and the deploy fails with:
      #
      #   BuildFailed: Authentication failed when pulling container image ...
      #     Provide 'registryCredentials' (username and token) ...
      #
      # That reads like a credentials problem but is really a visibility one.
      #
      # This step TRIES to flip it, but a repository-scoped GITHUB_TOKEN cannot
      # change an org package's visibility -- the API rejects it. Worse, plain
      # `curl` exits 0 on an HTTP error, so this step used to report SUCCESS
      # while changing nothing, which sent the deploy chasing a phantom
      # credentials bug. Writing the status code to a file and checking it makes
      # the failure visible.
      #
      # Non-fatal by design: the image is already built and pushed by now, so
      # failing here would not fix anything. If it reports a warning, change the
      # visibility once by hand -- it is sticky, so every later rebuild of this
      # same package inherits it.
      - name: Try to make the package public
        continue-on-error: true
        run: |
          CODE="$(curl -sS -o /tmp/body.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${IMAGE_NAME}" \
            -d '{"visibility":"public"}' || echo 000)"
          if [ "$CODE" = "200" ] || [ "$CODE" = "204" ]; then
            echo "Package visibility is now public."
          else
            echo "--- response ---"; cat /tmp/body.json; echo
            echo "::warning::Could not set package visibility (HTTP $CODE). A repository-scoped GITHUB_TOKEN cannot do this. Set it once by hand, then re-run the deploy: https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${IMAGE_NAME}/settings"
          fi

name: Build backend image

# Azure for Students blocks ACR Tasks ("TasksOperationsNotAllowed"), which is
# the mechanism `az containerapp up --source` uses to build an image in the
# cloud. This machine also has no Docker, so a local build is not an option.
# GitHub Actions fills both gaps: it builds the image on a free runner.
#
# Where the image goes
# --------------------
# Into Azure Container Registry `ca023b128445acr` -- NOT ghcr.io. ghcr.io was
# the original target, but it creates packages PRIVATE even from a public
# repository, and Azure Container Apps then cannot pull the image without
# registryCredentials. Azure gives no way to flip that from a workflow: the
# API needs admin rights on the package, and a repository-scoped GITHUB_TOKEN
# does not have them (it reports success while changing nothing, because curl
# exits 0 on an HTTP error).
#
# ACR sidesteps the whole problem, and the registry already existed -- an
# earlier `az containerapp up` had created it -- so this costs nothing extra.
#
# Authentication: OIDC, no stored secret
# -------------------------------------
# `azure/login` exchanges a short-lived GitHub OIDC token for an Azure token.
# Nothing is stored in the repository: AZURE_CLIENT_ID, AZURE_TENANT_ID and
# AZURE_SUBSCRIPTION_ID are identifiers, not secrets, so they live here in the
# clear. The trust is established by a federated credential on the
# `klassic-attendance-gha` app registration, scoped to this repository and the
# main branch, and that identity holds AcrPush on the registry only.
#
# One caveat discovered the hard way: on this subscription every
# `az role assignment` CLI verb fails with
#   MissingSubscription: The request did not have a subscription or a valid
#   tenant level resource provider.
# The ARM REST API itself works fine, so the role assignment was created with
# `az rest` instead. If it ever needs recreating, use `az rest`, not the CLI.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ca023b128445acr.azurecr.io
  ACR_NAME: ca023b128445acr
  # The image name is fixed. It is deliberately NOT derived from the repository
  # name: `KSI-AttendanceGeofencingandBiometrics-` lowercases to a TRAILING
  # HYPHEN, and Docker image components must match
  # [a-z0-9]+([._-][a-z0-9]+)*, which forbids a trailing separator.
  IMAGE_NAME: klassic-attendance-api

  # Identifiers, not secrets -- safe to keep in the clear.
  AZURE_CLIENT_ID: 3d7a3b58-b653-4dae-abef-39462a739b5f
  AZURE_TENANT_ID: dd76a4ce-b5a9-4f00-98fb-371d2092685d
  AZURE_SUBSCRIPTION_ID: 1bba41c3-77c1-493d-ab95-f43ab97c2dd3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for the OIDC token exchange
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Writes an ACR token into ~/.docker/config.json, which the build step
      # below picks up. This replaces docker/login-action: the registry
      # credential comes from the OIDC-authenticated az session, so no
      # registry password exists anywhere.
      - name: Log in to the registry
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile's COPY paths are relative to backend/, so the
          # context must be backend/ and not the repository root.
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${REGISTRY}/${IMAGE_NAME}:latest"
            echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

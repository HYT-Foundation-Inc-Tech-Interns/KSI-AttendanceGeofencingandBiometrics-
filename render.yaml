# Render blueprint for the Klassic attendance API.
#
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repository.
# Render reads this file and creates the service; secrets marked `sync: false`
# are left blank and prompted for in the dashboard, so no credential is ever
# committed here.
#
# Why Render: as of 2026 it is the only host still offering a genuinely free
# tier for a long-running Docker web service. Fly.io is trial-only (card
# required), Koyeb removed free compute, and Railway has no free tier. Render's
# free plan stops the container after 15 minutes idle and takes up to a minute
# to start again, which is why the check-in page pings /v1/health on load -- see
# api.warmUp() in dashboard/src/lib/api.ts.
#
# Note Render's own docs say the free plan is not for production use. That is
# about uptime guarantees, not a prohibition; for a zero-budget deployment it is
# the available option.

services:
  - type: web
    name: klassic-attendance-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # /v1/health is @Public() on the server and checks the database, so a 200
    # means the app is up AND Supabase is reachable.
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      # --- runtime ---------------------------------------------------------
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: v1
      - key: LOG_LEVEL
        value: log
      # PORT is deliberately not set: Render assigns it, and the Dockerfile's
      # healthcheck reads $PORT at runtime.

      # --- database --------------------------------------------------------
      # Already points at Supabase in backend/.env; paste the same value here.
      - key: DATABASE_URL
        sync: false

      # --- auth ------------------------------------------------------------
      # JWT_SECRET and JWT_REFRESH_SECRET must be the same values the existing
      # tokens were signed with, or every logged-in session is invalidated.
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # --- CORS ------------------------------------------------------------
      # MUST be set to the deployed dashboard origin(s), comma-separated, with
      # no trailing slash. CORS_ORIGINS declared in backend/.env was previously
      # read by nothing; it is now wired up in src/main.ts. Until this matches
      # the real dashboard URL, the browser blocks every API call.
      - key: CORS_ORIGINS
        sync: false

      # --- geofencing / biometrics ----------------------------------------
      # DEV_SKIP_GEOFENCE_VALIDATION must stay "false": it is the one check
      # that genuinely runs, and turning it on makes check-in accept any
      # location. Geofencing is enforced in PostGIS and needs no paid service.
      - key: DEV_SKIP_GEOFENCE_VALIDATION
        value: "false"

      # DEV_SKIP_BIOMETRIC_VERIFICATION must be "false" on this deployment,
      # matching backend/.env. It previously said "true"; see the note below.
      #
      # The premise behind the old "true" was that verifyFace() throws
      # "Face matching service not available" whenever neither AWS Rekognition
      # nor InsightFace is configured, so every check-in would 401. That is out
      # of date. BiometricService now falls back to in-process descriptor
      # matching (DescriptorMatchService), which needs no external service and
      # is always available -- its own comment says verification "is functional
      # even when neither of these is configured". A real boot confirms it:
      #
      #   WARN [AwsRekognitionService] AWS credentials not configured. Rekognition disabled.
      #   WARN [InsightFaceService] InsightFace service not configured
      #   LOG  [BiometricService] No external face service configured; using
      #                           in-process descriptor matching
      #
      # The throw still exists, but only on the legacy IMAGE path -- reached
      # when a caller sends faceImage instead of faceDescriptor. The /checkin
      # page sends a descriptor (see the verifyFace() call in
      # attendance.service.ts), so it never takes that path.
      #
      # Setting this to "true" therefore fixes nothing and instead SILENTLY
      # DISABLES face verification, reducing check-in to verifying WHERE
      # (geofence) but not WHO (face) -- an employee's credentials alone would
      # be enough to check in from anywhere inside the fence. That is the
      # opposite of what this deployment exists to do.
      #
      # The image path (AWS Rekognition / InsightFace) stays a separate,
      # optional upgrade: Rekognition is billed per image and InsightFace needs
      # a host to run inference on. Neither is required for descriptor matching
      # to work, so neither blocks this deployment.
      - key: DEV_SKIP_BIOMETRIC_VERIFICATION
        value: "false"

      - key: FACE_MATCH_THRESHOLD
        value: "0.85"
      - key: LIVENESS_THRESHOLD
        value: "0.7"
      - key: MAX_GEOFENCE_DISTANCE_M
        value: "1000"
      - key: MAX_TIMESTAMP_DRIFT_SEC
        value: "300"
      - key: MAX_SHIFT_HOURS
        value: "16"

      # --- signing / encryption -------------------------------------------
      - key: HMAC_DEVICE_SIGNING_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

      # --- mail ------------------------------------------------------------
      # Employee creation sends the credentials by email, so these must be set
      # or that feature fails at runtime with "SMTP is not configured
      # (SMTP_HOST / SMTP_USER / SMTP_PASS)". They are read in
      # backend/src/modules/mail/mail.service.ts; SMTP_PORT defaults to 587 and
      # SMTP_SECURE to "false" if omitted, so both are declared explicitly here
      # to match the working local config.
      #
      # !! THE FREE PLAN BLOCKS SMTP OUTBOUND PORTS. Render's own docs, "Deploy
      # for Free": "Free web services can't send outbound network traffic on
      # ports 25, 465, or 587, commonly used for SMTP." The Gmail values in
      # backend/.env use port 587, so on the free instance the mailer will fail
      # to connect even with a correct App Password -- and the failure looks
      # like bad credentials, not a blocked port. To send mail on the free plan,
      # either use a provider that offers port 2525 (Brevo, Mailgun) or move to
      # an HTTP email API on 443. Paid instances have no such restriction.
      #
      # SMTP_PASS for a Gmail account is a 16-character App Password, not the
      # account password. SMTP_FROM is a display string of the form
      # `Name <address>` and contains spaces and angle brackets -- paste it as
      # the raw value, Render does not need it quoted.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # --- links -----------------------------------------------------------
      # The link inside the credential email. Not derivable at build time: it
      # depends on the Cloudflare Pages URL, which does not exist until Part 3.
      # Set it to https://<project>.pages.dev/checkin once that is known.
      - key: APP_CHECKIN_URL
        sync: false

      # --- rate limiting ---------------------------------------------------
      - key: RATE_LIMIT
        value: "100"

      # --- retention -------------------------------------------------------
      - key: BIOMETRIC_RETENTION_DAYS
        value: "365"
      - key: AUDIT_LOG_RETENTION_DAYS
        value: "2555"

      # --- feature flags ---------------------------------------------------
      - key: ENABLE_OFFLINE_SYNC
        value: "true"
      - key: ENABLE_MOCK_LOCATION_DETECTION
        value: "true"
      - key: ENABLE_ROOT_JAILBREAK_DETECTION
        value: "true"
      - key: ENABLE_PAYROLL_AUTO_EXPORT
        value: "false"
